<!-- ================= COMPLETE WORKING COMPONENT ================= -->
<div style="padding: 20px; display: flex; justify-content: center; font-family: sans-serif;">
  
  <!-- CARD -->
  <div style="background: #18191f; border: 1px solid #2f3542; border-radius: 14px; padding: 20px; width: 260px; text-align: center; color: #fff;">
    <div style="font-size: 32px; margin-bottom: 8px;">❤️</div>
    <h3 style="margin: 0 0 6px 0;">Instagram Likes</h3>
    <p style="color: #888; font-size: 13px; margin-bottom: 16px;">Instant delivery packs</p>
    
    <!-- DIRECT CLICK BUTTON -->
    <button 
      id="openBtn" 
      type="button" 
      style="width: 100%; padding: 12px; background: #e84118; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; position: relative; z-index: 10;">
      Top Up &rarr;
    </button>
  </div>

  <!-- POPUP / MODAL (DEFAULT HIDDEN) -->
  <div id="modalBox" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999999; justify-content: center; align-items: center;">
    
    <div style="background: #20222a; border-radius: 12px; width: 90%; max-width: 360px; padding: 20px; color: #fff; border: 1px solid #333;">
      
      <!-- HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h4 style="margin: 0; font-size: 16px;">Select Pack</h4>
        <span id="closeBtn" style="font-size: 22px; cursor: pointer; color: #aaa;">&times;</span>
      </div>

      <!-- PACKS LIST -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div onclick="selectItem('100 Likes - ₹15')" style="padding: 12px; background: #2c2f38; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;">
          <span>100 Likes</span>
          <span style="color: #2ed573; font-weight: bold;">₹15</span>
        </div>
        <div onclick="selectItem('500 Likes - ₹60')" style="padding: 12px; background: #2c2f38; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;">
          <span>500 Likes</span>
          <span style="color: #2ed573; font-weight: bold;">₹60</span>
        </div>
        <div onclick="selectItem('1,000 Likes - ₹110')" style="padding: 12px; background: #2c2f38; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;">
          <span>1,000 Likes</span>
          <span style="color: #2ed573; font-weight: bold;">₹110</span>
        </div>
      </div>

      <!-- ACTION BUTTON -->
      <button id="orderBtn" style="width: 100%; margin-top: 15px; padding: 12px; background: #555; color: #ccc; border: none; border-radius: 8px; font-weight: bold; cursor: not-allowed;" disabled>
        Select a pack
      </button>

    </div>
  </div>

</div>

<!-- SCRIPT -->
<script>
  const openBtn = document.getElementById('openBtn');
  const modalBox = document.getElementById('modalBox');
  const closeBtn = document.getElementById('closeBtn');
  const orderBtn = document.getElementById('orderBtn');

  // Nambada Display Flex Touraga Popup Thorakpani
  openBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    modalBox.style.display = 'flex';
  });

  // Close touba
  closeBtn.addEventListener('click', function() {
    modalBox.style.display = 'none';
  });

  // Outside click twbada thingba
  modalBox.addEventListener('click', function(e) {
    if (e.target === modalBox) {
      modalBox.style.display = 'none';
    }
  });

  // Pack amada nambada button switch touba
  function selectItem(name) {
    orderBtn.disabled = false;
    orderBtn.style.background = '#e84118';
    orderBtn.style.color = '#fff';
    orderBtn.style.cursor = 'pointer';
    orderBtn.innerText = 'Buy ' + name;
    
    orderBtn.onclick = function() {
      alert(name + " order link toure!");
      // Whatsapp/Payment API mfamsida hapchilli
    };
  }
</script>
