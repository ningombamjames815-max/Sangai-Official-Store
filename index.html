# Sangai-Official-Store
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>🦌 Sangai Official Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif}
html,body{overflow-x:hidden;width:100%;max-width:100vw;background:#050014;color:#fff}
body{padding-bottom:100px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 0%,#ff0000 0%,transparent 35%),radial-gradient(circle at 90% 20%,#0ea5e9 0%,transparent 35%),radial-gradient(circle at 50% 100%,#db2777 0%,transparent 35%);opacity:.30;z-index:-1}
/* TOPBAR - LOGO */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(10,10,30,.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,0,0,.3);width:100%;overflow:hidden}
.logo{display:flex;align-items:center;gap:6px;flex-shrink:1;min-width:0}
.logo-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #ff0000;box-shadow:0 0 15px rgba(255,0,0,.6);flex-shrink:0}
.logo b{font-size:18px;background:linear-gradient(90deg,#fff,#ff0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;white-space:nowrap}
.logo b span{font-size:7px;letter-spacing:2px;color:#cbd5ff;-webkit-text-fill-color:#cbd5ff;display:block}
.wallet-top{background:linear-gradient(90deg,#ff0000,#8b5cf6);padding:5px 5px 5px 8px;border-radius:30px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0;box-shadow:0 5px 15px rgba(255,0,0,.4)}
.wallet-top .rs{background:rgba(255,255,255,.25);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wallet-top .plus{background:#fff;color:#000;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.avatar{width:36px;height:36px;background:linear-gradient(135deg,#ff0000,#000);border:2px solid #ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
/* BANNER */
.banner{margin:10px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(255,0,0,.85),rgba(139,92,246,.9),rgba(236,72,153,.9)),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&fit=crop');background-size:cover;background-position:center;padding:16px;min-height:210px}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.4))}
.banner>*{position:relative;z-index:2}
.banner .logo-big{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 25px rgba(255,0,0,.8);margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);padding:7px 10px;border-radius:20px;font-size:11px;font-weight:600}
.banner h1{font-size:24px;margin-top:8px;line-height:1.2;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.banner p{margin-top:8px;font-size:13px;line-height:1.5;color:#e0e7ff}
.banner .read{color:#fff;background:rgba(255,255,255,.2);display:inline-block;padding:8px 14px;border-radius:20px;margin-top:12px;font-size:12px;font-weight:700}
.sec-title{display:flex;align-items:center;gap:10px;margin:20px 12px 10px}
.sec-title .dot{width:8px;height:32px;background:linear-gradient(180deg,#ff0000,#ec4899);border-radius:10px;flex-shrink:0}
.sec-title h2{font-size:18px;font-weight:800}
.sec-title span{margin-left:auto;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:20px;font-size:11px;color:#cbd5ff;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.game-card{background:rgba(255,255,255,.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:14px 8px;text-align:center;position:relative;cursor:pointer;overflow:hidden}
.game-card .topbadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;white-space:nowrap;z-index:2}
.game-card .topbadge.orange{background:linear-gradient(90deg,#f97316,#ea580c)}.game-card .topbadge.pink{background:linear-gradient(90deg,#ec4899,#db2777)}.game-card .topbadge.red{background:linear-gradient(90deg,#ff0000,#dc2626)}.game-card .topbadge.purple{background:linear-gradient(90deg,#8b5cf6,#7c3aed)}.game-card .topbadge.gold{background:linear-gradient(90deg,#f59e0b,#d97706);color:#000}.game-card .topbadge.blue{background:linear-gradient(90deg,#2563eb,#1d4ed8)}
.game-card .circle{width:72px;height:72px;border-radius:50%;border:3px solid #ff0000;margin:20px auto 8px;overflow:hidden;background:#fff;box-shadow:0 0 15px rgba(255,0,0,.4)}
.game-card .circle img{width:100%;height:100%;object-fit:cover;display:block}
.game-card h3{font-size:13px;line-height:1.3;min-height:34px;font-weight:700}
.game-card .topup{margin-top:8px;background:linear-gradient(90deg,#ff0000,#8b5cf6);color:#fff;border:none;padding:10px 0;width:100%;border-radius:18px;font-weight:800;cursor:pointer;font-size:13px}
.game-card.boost-highlight{border:1px solid #f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.25),rgba(255,255,255,.08))}
.game-card.boost-highlight .topup{background:linear-gradient(90deg,#f59e0b,#f97316);color:#000}
.detail-card{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:16px;margin:12px}
.step{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.step .num{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff0000,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.step h3{background:linear-gradient(90deg,#ff6b6b,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:17px;text-transform:uppercase}
.step p{color:#a5b4fc;font-size:11px}
.detail-input{width:100%;padding:14px 14px;margin:7px 0;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;font-size:14px;outline:none}
.detail-input:focus{border-color:#ff0000}
.detail-input::placeholder{color:#94a3b8}
.check-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff0000,#8b5cf6,#ec4899);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
