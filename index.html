<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sangai Official Store - Instant Game Top-Up</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- ================= NAVBAR ================= -->
  <nav class="sticky top-0 z-50 bg-[#111827]/90 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 to-amber-300 flex items-center justify-center font-black text-black text-xl shadow-lg shadow-yellow-500/20">
          S
        </div>
        <div>
          <a href="#" class="font-extrabold text-lg tracking-wide text-white">SANGAI <span class="text-yellow-400">STORE</span></a>
          <p class="text-[10px] text-gray-400">Direct WhatsApp Top-Up</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <a href="#" class="text-sm font-semibold text-gray-300 hover:text-yellow-400 flex items-center gap-1.5">
          <i class="fa-solid fa-house text-xs"></i> Home
        </a>
        <button onclick="toggleModal('loginModal')" class="bg-yellow-500 hover:bg-yellow-400 text-black text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 transition">
          <i class="fa-solid fa-user text-xs"></i> Login
        </button>
      </div>
    </div>
  </nav>

  <!-- ================= MAIN CONTAINER ================= -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1">
    
    <!-- Step 1: Select Game -->
    <section class="mb-6">
      <h3 class="text-xs uppercase tracking-wider text-yellow-400 font-bold mb-3 flex items-center gap-2">
        <span class="w-5 h-5 rounded-full bg-yellow-400 text-black flex items-center justify-center text-xs">1</span>
        Select Game
      </h3>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectGame('MLBB')" id="game-btn-mlbb" class="p-3.5 rounded-xl border-2 border-yellow-400 bg-gray-900 text-center font-bold text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-gamepad text-yellow-400"></i> Mobile Legends
        </button>
        <button type="button" onclick="selectGame('BGMI')" id="game-btn-bgmi" class="p-3.5 rounded-xl border-2 border-gray-800 bg-gray-900 text-center font-bold text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-crosshairs text-gray-400"></i> BGMI / PUBG
        </button>
      </div>
    </section>

    <!-- Step 2: Player Details & ID Verification -->
    <section class="mb-6 bg-gray-900 p-5 rounded-2xl border border-gray-800">
      <h3 class="text-xs uppercase tracking-wider text-yellow-400 font-bold mb-3 flex items-center gap-2">
        <span class="w-5 h-5 rounded-full bg-yellow-400 text-black flex items-center justify-center text-xs">2</span>
        Enter Player ID & Check Username
      </h3>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">User ID / Character ID</label>
          <input type="text" id="userId" placeholder="Enter User ID (press Enter)" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-400 text-white" />
        </div>
        <div id="zoneIdContainer">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Zone ID (Server)</label>
          <input type="text" id="zoneId" placeholder="Enter Zone ID (press Enter)" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-400 text-white" />
        </div>
      </div>

      <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
        <button type="button" onclick="checkUsername()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-yellow-400 text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-1.5 transition">
          <i class="fa-solid fa-magnifying-glass"></i> Check / Verify Name
        </button>
        <div id="usernameStatus" class="text-xs text-gray-400">
          Username: <span id="playerName" class="font-bold text-white">Not Verified</span>
        </div>
      </div>
    </section>

    <!-- Step 3: Recharge Packs -->
    <section class="mb-6">
      <h3 class="text-xs uppercase tracking-wider text-yellow-400 font-bold mb-3 flex items-center gap-2">
        <span class="w-5 h-5 rounded-full bg-yellow-400 text-black flex items-center justify-center text-xs">3</span>
        Select Recharge Pack
      </h3>
      <div id="packsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <!-- Packs dynamically populated -->
      </div>
    </section>

    <!-- Step 4: Payment Method Selection -->
    <section class="mb-6 bg-gray-900 p-5 rounded-2xl border border-gray-800">
      <h3 class="text-xs uppercase tracking-wider text-yellow-400 font-bold mb-3 flex items-center gap-2">
        <span class="w-5 h-5 rounded-full bg-yellow-400 text-black flex items-center justify-center text-xs">4</span>
        Select Payment Method
      </h3>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div onclick="selectPayment('Google Pay')" id="pay-gpay" class="payment-card border border-yellow-400 bg-yellow-400/10 p-3 rounded-xl text-center cursor-pointer font-semibold text-xs flex flex-col items-center gap-1.5">
          <i class="fa-brands fa-google-pay text-2xl text-blue-400"></i>
          <span>Google Pay</span>
        </div>
        <div onclick="selectPayment('PhonePe')" id="pay-phonepe" class="payment-card border border-gray-800 bg-gray-950 p-3 rounded-xl text-center cursor-pointer font-semibold text-xs flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-mobile-screen-button text-xl text-purple-400"></i>
          <span>PhonePe</span>
        </div>
        <div onclick="selectPayment('Paytm UPI')" id="pay-paytm" class="payment-card border border-gray-800 bg-gray-950 p-3 rounded-xl text-center cursor-pointer font-semibold text-xs flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-wallet text-xl text-cyan-400"></i>
          <span>Paytm UPI</span>
        </div>
        <div onclick="selectPayment('UPI QR Code')" id="pay-qr" class="payment-card border border-gray-800 bg-gray-950 p-3 rounded-xl text-center cursor-pointer font-semibold text-xs flex flex-col items-center gap-1.5">
          <i class="fa-solid fa-qrcode text-xl text-green-400"></i>
          <span>UPI QR Code</span>
        </div>
      </div>
    </section>

    <!-- Order Summary & Checkout -->
    <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
      <div class="grid grid-cols-2 gap-4 pb-4 border-b border-gray-800 text-sm">
        <div>
          <span class="text-xs text-gray-400 block">Selected Pack:</span>
          <span id="summaryPack" class="font-bold text-yellow-400">None selected</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400 block">Total Amount:</span>
          <span id="summaryPrice" class="font-black text-xl text-white">₹0</span>
        </div>
      </div>

      <button onclick="sendOrderToWhatsApp()" class="mt-4 w-full bg-green-500 hover:bg-green-600 text-black font-extrabold py-3.5 rounded-xl shadow-lg shadow-green-500/20 text-sm flex items-center justify-center gap-2 transition">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        Proceed to Order on WhatsApp
      </button>
    </section>

  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-
